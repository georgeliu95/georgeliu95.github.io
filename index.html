<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="George 的报告与技术笔记。">
  <title>George · Reports</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: #202a37; background: #f7f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 920px; margin: 0 auto; padding: 88px 24px 48px; }
    .eyebrow { color: #50637a; font-size: 13px; letter-spacing: .16em; }
    h1 { margin: 20px 0 16px; font-size: clamp(36px, 7vw, 64px); letter-spacing: -.04em; line-height: 1.15; }
    .intro { max-width: 600px; color: #596579; font-size: 18px; line-height: 1.8; }
    section { margin-top: 56px; padding: 28px; border: 1px solid #dce2e9; border-radius: 16px; background: #fff; }
    h2 { margin: 0 0 16px; font-size: 22px; }
    section p { margin: 0; color: #596579; line-height: 1.8; }
    footer { margin-top: 56px; color: #596579; font-size: 14px; }
    a { color: #285ab3; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #285ab3; outline-offset: 5px; }
    @media (prefers-color-scheme: dark) {
      :root { color: #edf1f7; background: #111722; }
      section { background: #192230; border-color: #334155; }
      .eyebrow, .intro, section p, footer { color: #b3c0d2; }
      a { color: #99bcff; }
    }
    @media (max-width: 480px) { main { padding-top: 56px; } section { padding: 22px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">GEORGE / REPORTS</p>
      <h1>报告与技术笔记</h1>
      <p class="intro">记录研究、实验与实践中的发现。</p>
    </header>
    <section aria-labelledby="reports-title">
      <h2 id="reports-title">报告目录</h2>
      <p><a href="reports/world-model/">World Model 世界模型</a></p>
      <p>从基础直觉到模型结构、交互世界与代表研究，包含插图、框图和交互演示。</p>
      <hr>
      <p><a href="reports/test/">Test HTML 报告</a></p>
      <p>用于验证 GitHub Pages 的 HTML 发布与访问。</p>
    </section>
    <footer><a href="https://github.com/georgeliu95">GitHub</a> · George</footer>
  </main>
</body>
</html>
